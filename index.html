    <h2 class="mb-4">Quiz de la Tabla Periódica</h2>

    <div class="mb-3">
      <label class="form-label">Desde:</label>
      <input type="number" id="desde" value="1" min="1" max="118" class="form-control d-inline-block w-auto">
      <label class="form-label">Hasta:</label>
      <input type="number" id="hasta" value="10" min="1" max="118" class="form-control d-inline-block w-auto">
    </div>

    <div class="mb-3">
      <label class="form-label">Mostrar:</label>
      <select id="modo" class="form-select d-inline-block w-auto">
        <option value="simbolo">Símbolo</option>
        <option value="nombre">Nombre</option>

    </div>

    <div id="pregunta">—</div>
    <div id="respuesta"></div>
    <p id="progreso" class="text-muted"></p>

    <div class="mt-3">
      <button class="btn btn-outline-secondary" onclick="anterior()">Anterior</button>
      <button class="btn btn-primary" onclick="siguiente()">Siguiente</button>
      <button class="btn btn-outline-success" onclick="mostrarRespuesta()">Mostrar respuesta</button>
      <button class="btn btn-outline-dark" onclick="mezclar()">Re-mezclar</button>
    </div>
  </div>

    <a href="https://www.instagram.com/ujat/" target="_blank" style="color: #E1306C; margin: 0 10px;">

      {numero: 117, simbolo: "Ts", nombre: "Teneso"},
      {numero: 118, simbolo: "Og", nombre: "Oganesón"}
    ];

    let lista = [];
    let indice = 0;
    let modo = "simbolo";

    function iniciar() {
      const desde = parseInt(document.getElementById("desde").value);
      const hasta = parseInt(document.getElementById("hasta").value);
      modo = document.getElementById("modo").value;

      lista = elementos.filter(e => e.numero >= desde && e.numero <= hasta);
      mezclarArray(lista);
      indice = 0;
      mostrar();
    }

    function mezclarArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function mostrar() {
      if (lista.length === 0) return;
      const e = lista[indice];
      let texto = "";

      if (modo === "simbolo") texto = e.simbolo;
      else if (modo === "nombre") texto = e.nombre;
      else texto = e.numero;

      document.getElementById("pregunta").textContent = texto;
      document.getElementById("respuesta").style.display = "none";
      document.getElementById("progreso").textContent = `${indice + 1} / ${lista.length}`;
    }

    function siguiente() {
      if (indice < lista.length - 1) {
        indice++;
        mostrar();
      }
    }

    function anterior() {
      if (indice > 0) {
        indice--;
        mostrar();
      }
    }

    function mezclar() {
      if (lista.length > 0) {
        mezclarArray(lista);
        indice = 0;
        mostrar();
      }
    }

    function mostrarRespuesta() {
      if (lista.length === 0) return;
      const e = lista[indice];
      const texto = `${e.nombre} — N.º ${e.numero}`;
      document.getElementById("respuesta").textContent = texto;
      document.getElementById("respuesta").style.display = "block";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") siguiente();
      if (e.key === "ArrowLeft") anterior();
      if (e.key === " ") mostrarRespuesta();
    });
